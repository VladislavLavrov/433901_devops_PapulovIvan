services:
  mariadb:
    container_name: web-mariadb-14
    hostname: mariadb
    image: mariadb:10.5
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: webdb
      MARIADB_USER: webdb
      MARIADB_PASSWORD: password
    ports:
      - "0.0.0.0:5144:3306"

  web:
    container_name: web-app-calculator-14
    hostname: app
    build: Calculator/
    ports:
      - "0.0.0.0:5014:5014"

  networks:
    default:
      ipam:
        config:
          - subnet: 93.88.178.160/27